<div
  class="panel-backdrop"
  (click)="close()"
  aria-hidden="true"
></div>

<aside
  #panel
  class="lead-detail-panel"
  role="dialog"
  aria-modal="true"
  aria-labelledby="lead-detail-title"
  tabindex="-1"
>
  <header class="panel-header">
    <div class="panel-brand">
      <div class="panel-brand__logo-wrap">
        <img
          class="panel-brand__logo"
          src="/assets/branding/aba-logo.jpg"
          alt="Grupo ABA"
        />
      </div>

      <div class="panel-title">
        <span class="eyebrow">
          DETALLE DEL PROSPECTO
        </span>

        <h2 id="lead-detail-title">
          {{ leadForm.controls.nombre.value }}
        </h2>
      </div>
    </div>

    <button
      type="button"
      class="close-button"
      (click)="close()"
      aria-label="Cerrar panel"
    >
      ×
    </button>
  </header>

  <form
    class="panel-content"
    [formGroup]="leadForm"
  >
    <div class="form-field">
      <label for="proyecto">
        Proyecto
      </label>

      <input
        id="proyecto"
        type="text"
        formControlName="proyecto"
        readonly
      />
    </div>

    <div class="form-field">
      <label for="asesorAsignado">
        Asesor asignado
      </label>

      <input
        id="asesorAsignado"
        type="text"
        formControlName="asesorAsignado"
        readonly
      />
    </div>

    <div class="form-field">
      <label for="telefono">
        Teléfono
      </label>

      <input
        id="telefono"
        type="text"
        formControlName="telefono"
        readonly
      />
    </div>

    <div class="form-field">
      <label for="correo">
        Correo
      </label>

      <input
        id="correo"
        type="email"
        formControlName="correo"
        readonly
      />
    </div>

    <div class="form-field source-field">
      <label for="origen">
        Origen publicitario
      </label>

      <input
        id="origen"
        class="source-input"
        type="text"
        formControlName="origen"
        readonly
      />
    </div>

    <div class="form-field">
      <label for="fechaIngreso">
        Fecha de ingreso
      </label>

      <input
        id="fechaIngreso"
        type="text"
        formControlName="fechaIngreso"
        readonly
      />
    </div>
  </form>
</aside>
