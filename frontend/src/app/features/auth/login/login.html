<div class="login-page">
  <div class="login-card">
    <div class="login-header">
      <span class="brand">CRM ABA</span>

      <h1>Iniciar sesión</h1>

      <p>
        Ingresa tus credenciales para acceder al sistema.
      </p>
    </div>

    <form (ngSubmit)="login()">
      <div class="form-group">
        <label for="email">
          Correo electrónico
        </label>

        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          autocomplete="email"
          placeholder="correo@grupoaba.mx"
          [disabled]="loading"
        />
      </div>

      <div class="form-group">
        <label for="password">
          Contraseña
        </label>

        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          autocomplete="current-password"
          placeholder="Contraseña"
          [disabled]="loading"
        />
      </div>

      @if (errorMessage) {
        <div class="error-message">
          {{ errorMessage }}
        </div>
      }

      <button
        type="submit"
        [disabled]="loading"
      >
        @if (loading) {
          Iniciando sesión...
        } @else {
          Iniciar sesión
        }
      </button>
    </form>
  </div>
</div>
